{{define "content"}}
    <article>
      <h1>{{.Post.Title}}</h1>
      <p class="meta"><time datetime="{{iso .Post.Date}}">{{date .Post.Date}}</time>
        {{- range .Post.Tags}} · <a href="/tags/{{.}}/">#{{.}}</a>{{end}}
        {{- if .Post.Draft}} · <span class="draft">draft</span>{{end}}</p>
      {{.Post.Body}}
    </article>
{{end}}
